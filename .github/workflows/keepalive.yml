# Supabase Free pauses projects after ~7 days without activity, which would stop
# the pg_cron scheduler. This makes one lightweight API request per day.
# Note: GitHub disables scheduled workflows in repos with no commits for 60 days.
name: Supabase keepalive
on:
  schedule: [{ cron: '17 6 * * *' }]
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping auth health endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: sb_publishable_ivca752fOQfebuWM3zITLw_khMs485O" \
            https://tbnhiznxuldicfspcroc.supabase.co/auth/v1/health)
          echo "status=$code"; test "$code" = "200"
